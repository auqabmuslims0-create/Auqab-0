{% extends 'base.html' %}

{% block title %}الإعدادات{% endblock %}

{% block head %}
<style>
    .settings-page {
        margin-top: 20px;
    }
    .settings-card {
        border-radius: 20px;
        border: none;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        background: #fff;
        overflow: hidden;
        height: 100%;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .settings-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    body.dark-mode .settings-card {
        background: #1e1e1e;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        color: #fff;
    }
    .settings-card-header {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        padding: 12px 20px;
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
    }
    .settings-card-body {
        padding: 20px;
    }
    .custom-input-wrap {
        position: relative;
        margin-bottom: 0;
    }
    .custom-input-wrap .form-control {
        border-radius: 12px;
        padding-right: 40px;
        padding-left: 40px;
        height: 48px;
        background-color: #fff;
        border: 1px solid #ced4da;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input-wrap .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(46,93,52,0.15);
    }
    .custom-input-icon {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #6c757d;
        pointer-events: none;
        z-index: 2;
    }
    body.dark-mode .custom-input-wrap .form-control {
        background-color: #2d2d2d;
        border-color: #444;
        color: #fff;
    }
    body.dark-mode .custom-input-wrap .form-control:focus {
        border-color: #c9a227;
        box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.2);
    }
    body.dark-mode .custom-input-icon {
        color: #adb5bd;
    }
    .btn-save {
        border-radius: 25px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
        font-size: 1.1rem;
    }
    .btn-save:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container settings-page">
    <h1 class="text-center mb-4"><i class="bi bi-gear"></i> إعدادات النظام</h1>
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="row g-4 justify-content-center">
            <!-- بطاقة سعر الاشتراك -->
            <div class="col-md-6 col-lg-3">
                <div class="card settings-card">
                    <div class="settings-card-header">
                        <i class="bi bi-cash"></i> سعر الاشتراك
                    </div>
                    <div class="settings-card-body">
                        <label class="form-label fw-bold mb-2">القيمة (ل.س)</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-cash custom-input-icon"></i>
                            <input type="number" step="0.01" min="0" name="subscription_price"
                                   class="form-control" value="{{ subscription_price }}" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- بطاقة مدة الاشتراك -->
            <div class="col-md-6 col-lg-3">
                <div class="card settings-card">
                    <div class="settings-card-header">
                        <i class="bi bi-calendar-check"></i> مدة الاشتراك
                    </div>
                    <div class="settings-card-body">
                        <label class="form-label fw-bold mb-2">عدد الأيام</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-calendar custom-input-icon"></i>
                            <input type="number" min="1" step="1" name="subscription_duration_days"
                                   class="form-control" value="{{ subscription_duration_days }}" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- بطاقة رقم المحفظة -->
            <div class="col-md-6 col-lg-3">
                <div class="card settings-card">
                    <div class="settings-card-header">
                        <i class="bi bi-wallet2"></i> رقم المحفظة
                    </div>
                    <div class="settings-card-body">
                        <label class="form-label fw-bold mb-2">رقم المحفظة الإلكترونية</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-wallet2 custom-input-icon"></i>
                            <input type="text" name="wallet_number" class="form-control"
                                   value="{{ wallet_number }}" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- بطاقة رسوم التوصيل -->
            <div class="col-md-6 col-lg-3">
                <div class="card settings-card">
                    <div class="settings-card-header">
                        <i class="bi bi-truck"></i> رسوم التوصيل
                    </div>
                    <div class="settings-card-body">
                        <label class="form-label fw-bold mb-2">القيمة الافتراضية (ل.س)</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-truck custom-input-icon"></i>
                            <input type="number" step="0.01" min="0" name="delivery_fee"
                                   class="form-control" value="{{ delivery_fee }}" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-custom btn-save px-5">
                    <i class="bi bi-save"></i> حفظ الإعدادات
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
