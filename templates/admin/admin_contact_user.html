{% extends 'base.html' %}

{% block title %}مراسلة المستخدم{% endblock %}

{% block head %}
<style>
    .contact-card {
        border-radius: 20px;
        border: none;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        background: #fff;
    }
    body.dark-mode .contact-card {
        background: #1e1e1e;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        color: #fff;
    }
    .custom-input-wrap {
        position: relative;
        margin-bottom: 0;
    }
    .custom-input-wrap .form-control {
        border-radius: 12px;
        padding-right: 40px;
        padding-left: 40px;
        height: 48px;
        background-color: #fff;
        border: 1px solid #ced4da;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input-wrap textarea.form-control {
        height: auto;
        padding-top: 12px;
        padding-bottom: 12px;
    }
    .custom-input-wrap .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(46,93,52,0.15);
    }
    .custom-input-icon {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #6c757d;
        pointer-events: none;
        z-index: 2;
    }
    .custom-input-wrap textarea ~ .custom-input-icon {
        top: 18px;
        transform: none;
    }
    body.dark-mode .custom-input-wrap .form-control {
        background-color: #2d2d2d;
        border-color: #444;
        color: #fff;
    }
    body.dark-mode .custom-input-wrap .form-control:focus {
        border-color: #c9a227;
        box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.2);
    }
    body.dark-mode .custom-input-icon {
        color: #adb5bd;
    }
    .btn-send {
        border-radius: 25px;
        padding: 10px;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
    }
    .btn-send:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm contact-card">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope-plus auth-icon"></i>
                    <h1 class="h4 mt-2">مراسلة {{ target_user.username }}</h1>
                </div>

                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">العنوان</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-chat-left-text custom-input-icon"></i>
                            <input type="text" name="title" class="form-control" placeholder="عنوان الرسالة" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">الرسالة</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-pencil custom-input-icon"></i>
                            <textarea name="message" class="form-control" rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom btn-send w-100 py-3">إرسال</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
