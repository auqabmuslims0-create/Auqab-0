{% extends 'base.html' %}

{% block title %}تعيين كلمة مرور جديدة{% endblock %}

{% block head %}
<style>
    .custom-input-wrap {
        position: relative;
        margin-bottom: 0;
    }
    .custom-input-wrap .form-control {
        border-radius: 12px;
        padding-right: 40px;
        padding-left: 40px;
        height: 48px;
        background-color: #fff;
        border: 1px solid #ced4da;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input-wrap .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(46,93,52,0.15);
    }
    .custom-input-icon {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #6c757d;
        pointer-events: none;
        z-index: 2;
    }
    .custom-input-toggle {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #6c757d;
        z-index: 2;
        cursor: pointer;
        padding: 4px 8px;
    }
    .custom-input-toggle:hover {
        color: var(--primary);
    }
    body.dark-mode .custom-input-wrap .form-control {
        background-color: #2d2d2d;
        border-color: #444;
        color: #fff;
    }
    body.dark-mode .custom-input-wrap .form-control:focus {
        border-color: #c9a227;
        box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.2);
    }
    body.dark-mode .custom-input-icon,
    body.dark-mode .custom-input-toggle {
        color: #adb5bd;
    }
    .auth-card {
        border-radius: var(--radius-lg);
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    body.dark-mode .auth-card {
        background: rgba(30,30,30,0.85);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 shadow-sm auth-card">
                <div class="text-center mb-4">
                    <i class="bi bi-lock auth-icon-gold"></i>
                    <h1 class="h3 mt-2">تعيين كلمة مرور جديدة</h1>
                </div>

                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label">كلمة المرور الجديدة</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-lock custom-input-icon"></i>
                            <input type="password" name="password" id="password" class="form-control" required autocomplete="new-password" placeholder="أدخل كلمة المرور الجديدة">
                            <button class="custom-input-toggle" type="button" id="togglePasswordBtn" aria-label="إظهار كلمة المرور">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-text">
                            <small id="passwordStrength"></small>
                        </div>
                        <div class="progress mt-1 password-strength-progress">
                            <div id="passwordStrengthBar" class="progress-bar" style="width:0%"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">تأكيد كلمة المرور</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-lock custom-input-icon"></i>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required autocomplete="new-password" placeholder="أعد إدخال كلمة المرور">
                            <button class="custom-input-toggle" type="button" id="toggleConfirmPasswordBtn" aria-label="إظهار كلمة المرور">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMatchFeedback" class="form-text text-danger d-none">
                            كلمتا المرور غير متطابقتين
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom w-100">تأكيد العملية</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function checkPasswordMatch() {
        var pwd = document.getElementById('password');
        var confirm = document.getElementById('confirm_password');
        var feedback = document.getElementById('passwordMatchFeedback');
        if (pwd.value === confirm.value) {
            confirm.classList.remove('is-invalid');
            feedback.classList.add('d-none');
        } else {
            confirm.classList.add('is-invalid');
            feedback.classList.remove('d-none');
        }
    }

    function togglePassword(inputId, btn) {
        var pwd = document.getElementById(inputId);
        var icon = btn.querySelector('i');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pwd.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    document.getElementById('togglePasswordBtn').addEventListener('click', function() {
        togglePassword('password', this);
    });

    document.getElementById('toggleConfirmPasswordBtn').addEventListener('click', function() {
        togglePassword('confirm_password', this);
    });

    document.getElementById('password').addEventListener('input', function() {
        var pwd = this.value;
        var strength = 0;
        var feedback = [];
        if (pwd.length >= 8) strength++;
        else feedback.push('8 أحرف على الأقل');
        if (/[A-Z]/.test(pwd)) strength++;
        else feedback.push('حرف كبير');
        if (/[a-z]/.test(pwd)) strength++;
        else feedback.push('حرف صغير');
        if (/\d/.test(pwd)) strength++;
        else feedback.push('رقم');
        if (/[^A-Za-z0-9]/.test(pwd)) strength++;
        else feedback.push('رمز خاص');

        var bar = document.getElementById('passwordStrengthBar');
        var label = document.getElementById('passwordStrength');
        var percent = (strength / 5) * 100;
        bar.style.width = percent + '%';
        if (strength <= 2) {
            bar.className = 'progress-bar bg-danger';
            label.innerHTML = 'ضعيفة: ' + feedback.join(', ');
            label.className = 'text-danger';
        } else if (strength <= 4) {
            bar.className = 'progress-bar bg-warning';
            label.innerHTML = 'متوسطة: ' + feedback.join(', ');
            label.className = 'text-warning';
        } else {
            bar.className = 'progress-bar bg-success';
            label.innerHTML = 'قوية';
            label.className = 'text-success';
        }
        if (pwd === '') {
            bar.style.width = '0%';
            label.innerHTML = '';
        }
        checkPasswordMatch();
    });

    document.getElementById('confirm_password').addEventListener('input', checkPasswordMatch);
</script>
{% endblock %}
