{% extends 'base.html' %}

{% block title %}استعادة كلمة المرور{% endblock %}

{% block head %}
<style>
    /* نفس نمط الحقول الموحدة */
    .custom-input-wrap {
        position: relative;
        margin-bottom: 0;
    }
    .custom-input-wrap .form-control {
        border-radius: 12px;
        padding-right: 40px;
        padding-left: 40px;
        height: 48px;
        background-color: #fff;
        border: 1px solid #ced4da;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input-wrap .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(46,93,52,0.15);
    }
    .custom-input-icon {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #6c757d;
        pointer-events: none;
        z-index: 2;
    }
    body.dark-mode .custom-input-wrap .form-control {
        background-color: #2d2d2d;
        border-color: #444;
        color: #fff;
    }
    body.dark-mode .custom-input-wrap .form-control:focus {
        border-color: #c9a227;
        box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.2);
    }
    body.dark-mode .custom-input-icon {
        color: #adb5bd;
    }
    .auth-card {
        border-radius: var(--radius-lg);
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    body.dark-mode .auth-card {
        background: rgba(30,30,30,0.85);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 shadow-sm auth-card">
                <div class="text-center mb-4">
                    <i class="bi bi-key auth-icon-gold"></i>
                    <h1 class="h3 mt-2">استعادة كلمة المرور</h1>
                    <p class="text-muted small">أدخل بريدك الإلكتروني وسنساعدك على الاستعادة.</p>
                </div>

                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="custom-input-wrap">
                            <i class="bi bi-envelope custom-input-icon"></i>
                            <input type="email" name="email" class="form-control" required autofocus autocomplete="email" placeholder="example@mail.com">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-custom w-100">متابعة</button>
                </form>

                <p class="mt-3 text-center mb-0">
                    <a href="{{ url_for('auth.login') }}">عودة لتسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
